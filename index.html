  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .background-container {
      position: absolute;
      inset: 0;
      background-image: url("images/perfilfundo.jpg");
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1;
    }

    .main-container {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255,255,255,0.3);
      margin-bottom: 16px;
    }

    .name {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 0 rgba(16,185,129,0.7);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.7); }
      70% { box-shadow: 0 0 0 10px rgba(16,185,129,0); }
      100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }

    .status-text {
      color: #6ee7b7;
      font-size: 14px;
      font-weight: 500;
    }

    .button {
      width: 100%;
      background: linear-gradient(135deg, #2AABEE, #229ED9);
      border: none;
      border-radius: 12px;
      padding: 16px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(34,158,217,0.35);
    }

    .button-text-main {
      font-size: 13px;
      font-weight: 600;
    }

    .button-text-sub {
      font-size: 12px;
      opacity: 0.9;
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>

  <div class="overlay"></div>

  <div class="main-container">
    <div class="card">
      <!-- ✅ ALT AJUSTADO -->
      <img src="images/perfil.jpg" alt="Foto de Carolina Andrade" class="avatar">

      <div class="name">Carolina Andrade</div>

      <div class="status">
        <div class="status-dot"></div>
        <span class="status-text">Online agora...</span>
      </div>

      <button class="button" id="telegram-button">
        <div class="button-text-main">ENVIE UMA MENSAGEM PARA ELA AGORA NO TELEGRAM</div>
        <div class="button-text-sub">CLIQUE AQUI</div>
      </button>

      <footer>
        © 2025 Carolina Andrade<br>
        Todos os direitos reservados
      </footer>
    </div>
  </div>

  <script>
    document.getElementById('telegram-button').addEventListener('click', function () {

      } catch(e){}

      setTimeout(() => {
        window.location.href = 'https://divinuzvips.xyz/go/oferta01?tkn=r7pb7t5da6';
      }, Math.floor(Math.random() * (1200 - 600 + 1)) + 600);
    });
  </script>
